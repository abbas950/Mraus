<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mraus (مراوس) - منصة المقايضة الرقمية العالمية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ===== ضع إعدادات Firebase الخاصة بك هنا =====
        const firebaseConfig = {
            apiKey: "AIzaSyCCNYumvakjtEb0tygzzGkm0Z72VAPf1BE",
  authDomain: "skills-barter-app.firebaseapp.com",
  projectId: "skills-barter-app",
  storageBucket: "skills-barter-app.firebasestorage.app",
  messagingSenderId: "123382285084",
  appId: "1:123382285084:web:d98136775fa4888fb9b0d9"

        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allSkills = [];

        window.openAddModal = function() {
            document.getElementById('addModal').classList.remove('hidden');
        }
        window.closeAddModal = function() {
            document.getElementById('addModal').classList.add('hidden');
        }

        // إضافة إعلان جديد
        window.addSkill = async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري النشر...';

            try {
                await addDoc(collection(db, "skills"), {
                    userName: document.getElementById('userName').value.trim(),
                    country: document.getElementById('userCountry').value.trim(),
                    category: document.getElementById('skillCategory').value,
                    skillOffered: document.getElementById('skillOffered').value.trim(),
                    skillWanted: document.getElementById('skillWanted').value.trim(),
                    whatsapp: document.getElementById('userWhatsapp').value.trim(),
                    skillDesc: document.getElementById('skillDesc').value.trim(),
                    createdAt: serverTimestamp()
                });

                showNotification('تم نشر إعلانك على منصة Mraus بنجاح! 🎉', 'success');
                closeAddModal();
                document.getElementById('skillForm').reset();
                loadSkills();
            } catch (error) {
                console.error("خطأ في النشر: ", error);
                showNotification('حدث خطأ أثناء النشر، تأكد من الاتصال وقواعد بيانات فايربيس.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "نشر الإعلان مجاناً";
            }
        }

        // جلب الإعلانات من قاعدة البيانات
        async function loadSkills() {
            const grid = document.getElementById('skillsGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-16 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i><p>جاري تحميل المهارات والخدمات...</p></div>';

            try {
                const q = query(collection(db, "skills"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                allSkills = [];
                querySnapshot.forEach((doc) => {
                    allSkills.push({ id: doc.id, ...doc.data() });
                });

                renderSkills(allSkills);
            } catch (error) {
                console.error("خطأ في الجلب: ", error);
                grid.innerHTML = '<div class="col-span-full text-center py-16 text-red-500"><i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i><p>تعذر الاتصال بقاعدة البيانات. يرجى التحقق من قواعد أمان Firebase Firestore.</p></div>';
            }
        }

        // عرض المهارات في الشاشة
        window.renderSkills = function(skillsArray) {
            const grid = document.getElementById('skillsGrid');
            
            if (skillsArray.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-2xl border border-dashed border-gray-200">
                        <i class="fa-solid fa-box-open text-4xl text-gray-300 mb-3"></i>
                        <h4 class="text-lg font-bold text-gray-600">لا توجد مهارات مطابقة</h4>
                        <p class="text-sm text-gray-400 mt-1">كن أول من يضيف خدمته ويقايض بها اليوم!</p>
                    </div>`;
                return;
            }

            grid.innerHTML = "";
            skillsArray.forEach((data) => {
                const categoryNames = {
                    programming: 'برمجة وتطوير',
                    design: 'تصميم وفنون',
                    languages: 'ترجمة ولغات',
                    marketing: 'تسويق وأعمال',
                    maintenance: 'صيانة وهندسة',
                    other: 'مهارات متنوعة'
                };

                const categoryLabel = categoryNames[data.category] || 'خدمة عامة';
                const whatsappLink = data.whatsapp ? `https://wa.me/${data.whatsapp.replace(/[^0-9]/g, '')}?text=${encodeURIComponent('مرحباً ' + data.userName + '، رأيت مهارتك (' + data.skillOffered + ') على منصة Mraus (مراوس) وأرغب بالمقايضة.')}` : '#';

                const card = `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col justify-between hover:shadow-md transition duration-300">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="bg-indigo-50 text-indigo-600 text-xs px-3 py-1 rounded-full font-semibold"><i class="fa-solid fa-tag"></i> ${categoryLabel}</span>
                                <span class="text-xs text-gray-400"><i class="fa-solid fa-location-dot"></i> ${data.country || 'عالمي'}</span>
                            </div>
                            <h4 class="text-lg font-bold text-gray-800 mb-2">${escapeHtml(data.skillOffered)}</h4>
                            <p class="text-gray-600 text-sm line-clamp-3 mb-4 leading-relaxed">${escapeHtml(data.skillDesc)}</p>
                        </div>
                        <div class="pt-4 border-t border-gray-100 flex flex-col gap-3">
                            <div class="bg-emerald-50 text-emerald-800 text-xs p-2.5 rounded-xl font-medium flex items-center gap-2">
                                <i class="fa-solid fa-gift text-emerald-600 text-base"></i>
                                <span class="truncate">يريد بالمقابل: <strong>${escapeHtml(data.skillWanted)}</strong></span>
                            </div>
                            <div class="flex justify-between items-center text-xs text-gray-500 pt-1">
                                <span>بواسطة: ${escapeHtml(data.userName)}</span>
                                ${data.whatsapp ? `
                                <a href="${whatsappLink}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold transition flex items-center gap-1.5 shadow-sm">
                                    <i class="fa-brands fa-whatsapp text-sm"></i> مراسلة واتساب
                                </a>` : `
                                <span class="text-gray-400 text-xs">لا يوجد رقم تواصل</span>`}
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // نظام البحث والفلترة
        window.filterSkills = function() {
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;

            const filtered = allSkills.filter(item => {
                const matchesSearch = item.skillOffered.toLowerCase().includes(searchKeyword) || 
                                      item.skillWanted.toLowerCase().includes(searchKeyword) || 
                                      item.skillDesc.toLowerCase().includes(searchKeyword) ||
                                      item.country.toLowerCase().includes(searchKeyword);
                
                const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;

                return matchesSearch && matchesCategory;
            });

            renderSkills(filtered);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function showNotification(message, type = 'success') {
            const notif = document.createElement('div');
            notif.className = `fixed bottom-5 left-5 z-50 px-5 py-3 rounded-xl shadow-lg text-white font-medium text-sm transition transform translate-y-0 ${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`;
            notif.innerText = message;
            document.body.appendChild(notif);
            setTimeout(() => { notif.remove(); }, 4000);
        }

        window.addEventListener('DOMContentLoaded', loadSkills);
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">

    <!-- شريط التنصّت العلوي -->
    <nav class="bg-indigo-700 text-white shadow-md sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
        <div class="container mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-xl font-extrabold flex items-center gap-2.5 tracking-tight">
                <i class="fa-solid fa-hands-holding-circle text-indigo-300"></i> Mraus | مَرَاوِس
            </h1>
            <div>
                <button onclick="openAddModal()" class="bg-white text-indigo-700 px-5 py-2 rounded-xl font-bold shadow-sm hover:bg-indigo-50 transition text-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> أضف مهارتك مجاناً
                </button>
            </div>
        </div>
    </nav>

    <!-- الهيدر الترحيبي -->
    <header class="bg-gradient-to-br from-indigo-800 to-indigo-600 text-white py-16 text-center px-4 shadow-inner">
        <div class="max-w-3xl mx-auto">
            <span class="bg-indigo-500 bg-opacity-40 text-indigo-100 text-xs px-3.5 py-1.5 rounded-full font-semibold uppercase tracking-wider mb-4 inline-block">منصة المقايضة الرقمية المجانية 100%</span>
            <h2 class="text-3xl md:text-5xl font-black mb-4 leading-tight">قايض بمهارتك مع أي شخص في العالم بلا أموال!</h2>
            <p class="text-indigo-100 text-base md:text-lg leading-relaxed opacity-90">في منصة <strong>Mraus (مراوس)</strong>، لا تحتاج لدفع المال.. اعرض مهارتك واحصل على الخدمة التي تحتاجها بالمقابل بكل بساطة وتضامن.</p>
        </div>
    </header>

    <!-- شريط البحث والفلترة -->
    <section class="container mx-auto px-4 -mt-6 relative z-10">
        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-md border border-gray-100 flex flex-col md:flex-row gap-4 items-center">
            <div class="relative w-full md:w-2/3">
                <i class="fa-solid fa-search absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" oninput="filterSkills()" placeholder="ابحث عن مهارة، خدمة، أو دولة (مثلاً: تصميم، بغداد...)" class="w-full pr-11 pl-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            <div class="w-full md:w-1/3">
                <select id="categoryFilter" onchange="filterSkills()" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white cursor-pointer">
                    <option value="all">جميع التصنيفات</option>
                    <option value="programming">برمجة وتطوير</option>
                    <option value="design">تصميم وفنون</option>
                    <option value="languages">ترجمة ولغات</option>
                    <option value="marketing">تسويق وأعمال</option>
                    <option value="maintenance">صيانة وهندسة</option>
                    <option value="other">مهارات متنوعة</option>
                </select>
            </div>
        </div>
    </section>

    <!-- محتوى الصفحة -->
    <main class="container mx-auto px-4 py-10">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-
